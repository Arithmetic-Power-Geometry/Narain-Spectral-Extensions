name: P25 pinned short-vector indecomposability certificate
on:
  push:
    paths:
      - '.github/workflows/p25-certificate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install sympy==1.14.0
      - name: Replay committed exact scripts and preserve actual outputs
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,subprocess,json,hashlib,sys,time,platform,resource,os
          out=pathlib.Path('evidence/P25/ci_run');out.mkdir(parents=True,exist_ok=True)
          tasks=[('P22_original','evidence/P22/check.py'),('P23_independent','evidence/P23/independent.py'),('P24_projector','evidence/P24/projector_checker.py'),('P25_bounds','evidence/P25/certificate_bounds.py'),('P25_fraction','evidence/P25/short_vector_obstruction.py'),('P25_independent','evidence/P25/independent_certificate.py')]
          report={'checkout_sha':os.environ.get('GITHUB_SHA'),'python':sys.version,'platform':platform.platform(),'runs':[]}
          failures=[]
          for name,path in tasks:
           p=pathlib.Path(path);start=time.monotonic()
           try:
            r=subprocess.run([sys.executable,str(p)],capture_output=True,timeout=240)
            stdout,stderr,code=r.stdout,r.stderr,r.returncode
            (out/(name+'.stdout')).write_bytes(stdout);(out/(name+'.stderr')).write_bytes(stderr)
            rec={'name':name,'path':path,'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'stdout_sha256':hashlib.sha256(stdout).hexdigest(),'stderr_sha256':hashlib.sha256(stderr).hexdigest(),'exit_code':code,'wall_seconds':round(time.monotonic()-start,4),'max_rss_kb_cumulative':resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss}
            data=json.loads(stdout)
            if name=='P25_bounds':rec['pass']=data['all_charges_E_below_H_have_coordinates_in_minus1_0_1']
            elif name=='P25_fraction':rec['pass']=len(data['results'])==2 and all(x['span_rank']==2*x['d'] and x['J_graph_component_ranks']==[2*x['d']] for x in data['results'])
            elif name=='P25_independent':rec['pass']=len(data['cases'])==2 and all(x['certified'] and x['J_connected_vertices']==x['short_vectors'] for x in data['cases'])
            elif name=='P24_projector':rec['pass']=len(data['coupled'])==2 and all(x['involution'] for x in data['coupled']) and data['B_shift_GL']['integral']
            else:rec['pass']=code==0
            if code or not rec['pass']:failures.append(name)
           except Exception as e:rec={'name':name,'error':repr(e)};failures.append(name)
           report['runs'].append(rec)
           (out/'matrix.json').write_text(json.dumps(report,indent=2)+'\n')
          report['failed']=failures;(out/'matrix.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if failures:sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p25-full-indecomposability-certificate
          path: evidence/P25/ci_run/
          retention-days: 90
      - name: Commit evidence to Narain-Spectral-Extensions
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/P25/ci_run/
          if ! git diff --cached --quiet; then
            git commit -m 'P25 CI: preserve pinned exact theorem certificate outputs'
            git push
          fi
