name: P19 original checker execution and evidence commit
on:
  push:
    paths:
      - '.github/workflows/p19-evidence-rescue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute P01-P09 unchanged
        run: python evidence/P18/run_originals.py
      - name: Preserve machine-readable logs in P19
        if: always()
        shell: bash
        run: |
          mkdir -p evidence/P19/ci_run
          if [ -d evidence/P18/ci_run ]; then cp -a evidence/P18/ci_run/. evidence/P19/ci_run/; fi
          python - <<'PY'
          import pathlib,hashlib,json,subprocess
          p=pathlib.Path('evidence/P19/ci_run')
          hashes={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(p.rglob('*')) if x.is_file()}
          (p/'artifact_sha256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p19-original-checker-logs
          path: evidence/P19/ci_run/
          retention-days: 90
      - name: Commit outputs back to the new repository only
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/P19/ci_run/
          if ! git diff --cached --quiet; then
            git commit -m 'P19 CI: preserve executed original-checker stdout stderr hashes and JSON diffs'
            git push
          fi
