name: P21 independent CI certificate replay
on:
  push:
    paths:
      - '.github/workflows/p21-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Replay four exact checkers and preserve actual evidence
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,subprocess,hashlib,json,sys,time,platform
          out=pathlib.Path('evidence/P21/ci_run');out.mkdir(parents=True,exist_ok=True)
          files={'check':'a3262fa6e251ad1c1430e2e944d8268e422abac6e6bc6889d8034d45b0466d13','classify':'e273eca7f2cdeb43c8302df189e23b2b761bac216c81d03dacc14b9f7d9508fa','radius_upgrade':'310de1f6863708b382a86ac031eb858026d10f5b82c7f66148d977b9fd2ca627','adversarial':'afa9f0d4559a4510c73b0d88e9206d45102cb05f1db298429921de4e38cafde1'}
          matrix={'python':sys.version,'platform':platform.platform(),'runs':[]}
          failures=[]
          for name,expected_sha in files.items():
           path=pathlib.Path('evidence/P21')/(name+'.py');sha=hashlib.sha256(path.read_bytes()).hexdigest();t=time.monotonic()
           try:
            r=subprocess.run([sys.executable,str(path)],capture_output=True,timeout=180)
            (out/(name+'.stdout')).write_bytes(r.stdout);(out/(name+'.stderr')).write_bytes(r.stderr)
            result={'name':name,'source_sha256':sha,'source_hash_matches_local':sha==expected_sha,'exit_code':r.returncode,'elapsed_seconds':round(time.monotonic()-t,3),'stdout_sha256':hashlib.sha256(r.stdout).hexdigest(),'stderr_sha256':hashlib.sha256(r.stderr).hexdigest()}
            data=json.loads(r.stdout[r.stdout.find(b'{'):])
            if name=='check':result['certificate_pass']=len(data['cases'])==3 and all(x['twice_drift_less_than_gap'] and x['drift_less_than_H_margin'] and x['opposite_same_energy_count']==0 for x in data['cases'])
            elif name=='classify':result['certificate_pass']=len(data['cases'])==3 and all(x['accidental_energy_levels']==0 for x in data['cases'])
            elif name=='radius_upgrade':result['certificate_pass']=data['radius']=='1/10000000' and len(data['cases'])==3 and all(x['all_checks'] for x in data['cases'])
            else:result['certificate_pass']=len(data['cases'])==3 and all(len(x['cases'])==5 for x in data['cases'])
            if r.returncode or not result['source_hash_matches_local'] or not result['certificate_pass']:failures.append(name)
           except Exception as e:result={'name':name,'source_sha256':sha,'exception':repr(e)};failures.append(name)
           matrix['runs'].append(result)
           (out/'matrix.json').write_text(json.dumps(matrix,indent=2)+'\n')
          matrix['failed']=failures;(out/'matrix.json').write_text(json.dumps(matrix,indent=2)+'\n')
          print(json.dumps(matrix,indent=2))
          if failures:sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p21-independent-certificate-replay
          path: evidence/P21/ci_run/
          retention-days: 90
      - name: Commit execution artifacts to research repository
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/P21/ci_run/
          if ! git diff --cached --quiet; then
            git commit -m 'P21 CI: preserve independent certificate replay logs and SHA256'
            git push
          fi
