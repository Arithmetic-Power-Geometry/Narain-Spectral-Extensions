name: P29 pinned exact decomposition and P28 replay
on:
  push:
    paths:
      - '.github/workflows/p29-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install sympy==1.14.0
      - name: Execute and record actual results
        shell: bash
        run: |
          mkdir -p evidence/P29/ci_run
          python - <<'PY'
          import pathlib,subprocess,time,hashlib,json,os,sys,resource
          root=pathlib.Path('evidence/P29/ci_run')
          tasks={'algorithm':'evidence/P29/algorithm.py','independent':'evidence/P29/independent.py','p28':'evidence/P28/check.py'}
          report={'checkout_sha':os.environ.get('GITHUB_SHA'),'python':sys.version,'runs':[]}
          for name,path in tasks.items():
           t=time.perf_counter();p=subprocess.run([sys.executable,path],capture_output=True,timeout=180)
           (root/(name+'.stdout')).write_bytes(p.stdout);(root/(name+'.stderr')).write_bytes(p.stderr)
           entry={'name':name,'exit_code':p.returncode,'wall_seconds':round(time.perf_counter()-t,5),'max_rss_kb_cumulative':resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss,'source_sha256':hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest(),'stdout_sha256':hashlib.sha256(p.stdout).hexdigest(),'stderr_sha256':hashlib.sha256(p.stderr).hexdigest()}
           try:
            data=json.loads(p.stdout)
            if name=='algorithm':entry['signature']=[x['component_sizes'] for x in data['results']]
            elif name=='independent':entry['signature']=[x['component_sizes'] for x in data['records']]
            else:entry['signature']=[x['max_witness_below_lower_bound'] for x in data['tests']]
           except Exception as e:entry['parse_error']=str(e)
           report['runs'].append(entry)
          report['pass']=all(x['exit_code']==0 and 'parse_error' not in x for x in report['runs']) and report['runs'][0]['signature']==report['runs'][1]['signature']==[[4],[4,4],[8]] and all(report['runs'][2]['signature'])
          (root/'matrix.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not report['pass']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p29-exact-replay
          path: evidence/P29/ci_run/
      - name: Append CI evidence to repository
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/P29/ci_run/
          if ! git diff --cached --quiet; then
            git commit -m 'P29 CI: preserve exact pinned decomposition replay'
            git push
          fi
