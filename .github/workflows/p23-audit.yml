name: P23 pinned original replay and independent audit
on:
  push:
    paths:
      - '.github/workflows/p23-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent checker dependency
        run: python -m pip install sympy==1.14.0
      - name: Replay exact P22 and P23 sources without modifications
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,sys,pathlib,json,hashlib,time,platform
          out=pathlib.Path('evidence/P23/ci_run');out.mkdir(parents=True,exist_ok=True)
          matrix={'python':sys.version,'platform':platform.platform(),'runs':[]}
          failed=[]
          for name,path in [('P22_original','evidence/P22/check.py'),('P23_independent','evidence/P23/independent.py')]:
           p=pathlib.Path(path);start=time.monotonic()
           r=subprocess.run([sys.executable,str(p)],capture_output=True,timeout=180)
           (out/(name+'.stdout')).write_bytes(r.stdout)
           (out/(name+'.stderr')).write_bytes(r.stderr)
           record={'name':name,'path':path,'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'stdout_sha256':hashlib.sha256(r.stdout).hexdigest(),'stderr_sha256':hashlib.sha256(r.stderr).hexdigest(),'exit_code':r.returncode,'elapsed_seconds':round(time.monotonic()-start,3)}
           try:
            actual=json.loads(r.stdout);reference=json.loads(pathlib.Path('evidence/P22/stdout.json' if name=='P22_original' else 'evidence/P23/independent_stdout.json').read_text())
            actual.pop('runtime_s',None);actual.pop('elapsed_seconds',None)
            reference.pop('runtime_s',None);reference.pop('elapsed_seconds',None)
            record['semantic_json_equal']=actual==reference
           except Exception as e:record['parse_error']=str(e);record['semantic_json_equal']=False
           if r.returncode or not record['semantic_json_equal']:failed.append(name)
           matrix['runs'].append(record)
          matrix['failed']=failed
          (out/'matrix.json').write_text(json.dumps(matrix,indent=2)+'\n')
          if failed:sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p23-pinned-original-and-independent-audit
          path: evidence/P23/ci_run/
          retention-days: 90
      - name: Commit raw execution evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/P23/ci_run/
          if ! git diff --cached --quiet; then
            git commit -m 'P23 CI: original and independent raw checker execution evidence'
            git push
          fi
